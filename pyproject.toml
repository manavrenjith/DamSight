[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "damsight"
version = "0.1.0"
description = "Dam Break Inundation Modelling & Decision Support System for SIH 2026 PS #161"
readme = "README.md"
authors = [{ name = "DamSight Team" }]
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
gis = [
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "osmnx>=1.6.0",
    "networkx>=3.0",
]
ml = [
    "scikit-learn>=1.3.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow benchmark runs (deselected via -m 'not slow' if desired, active in default run)",
]
filterwarnings = [
    "default",
    "ignore:Use `@` matmul instead of `\\*` mul operator.*:PendingDeprecationWarning:rasterio\\.transform",
    "ignore:Use `@` matmul instead of `\\*` mul operator.*:PendingDeprecationWarning:affine",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["TRY004"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

